version: '3.8'

services:
  headscale:
    image: headscale/headscale:v0.23.0
    container_name: phantom-headscale
    restart: unless-stopped
    ports:
      - "8085:8080"      # API Headscale
      - "8086:8086"      # Panel admin (via Nginx)
    volumes:
      - ./config/config.yaml:/etc/headscale/config.yaml
      - ./config/acl.hujson:/etc/headscale/acl.hujson
      - ./config/nginx-ui.conf:/etc/nginx/conf.d/ui.conf
      - headscale-data:/var/lib/headscale
    environment:
      - HEADSCALE_SERVER_URL=http://82.70.74.120:8085
      - HEADSCALE_LISTEN_ADDR=0.0.0.0:8080
      - HEADSCALE_METRICS_LISTEN_ADDR=0.0.0.0:9090
      - HEADSCALE_DB_TYPE=sqlite3
      - HEADSCALE_DB_PATH=/var/lib/headscale/db.sqlite
      - HEADSCALE_ACL_POLICY_MODE=file
      - HEADSCALE_ACL_POLICY_PATH=/etc/headscale/acl.hujson
      - HEADSCALE_DERP_SERVER_URLS=http://100.71.200.103:8086
      - HEADSCALE_DERP_AUTO_UPDATE=true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx-ui:
    image: nginx:alpine
    container_name: phantom-headscale-ui
    restart: unless-stopped
    ports:
      - "8086:80"
    volumes:
      - ./config/nginx-ui.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - headscale

volumes:
  headscale-data:
    name: phantom-headscale-data
