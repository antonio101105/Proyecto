# PHANTOM Nginx Proxy Config para Headscale UI
# Contenedor: phantom-headscale-ui-proxy (nginx:alpine)
# Escucha en: 100.71.200.103:8086 (IP Tailscale personal - SOLO red admin)
# Proxy hacia: headscale:8080 (interno)

server {
    listen 80;
    server_name _;

    # Panel de administración Headscale (goodieshq/headscale-admin)
    location /admin/ {
        proxy_pass http://headscale:8080/web/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support para UI reactiva
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts generosos para UI
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # API Headscale (usada por headscale-admin y CLI)
    location /api/ {
        proxy_pass http://headscale:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check
    location /health {
        proxy_pass http://headscale:8080/health;
        proxy_set_header Host $host;
    }
}

# NOTA: Este contenedor SOLO escucha en 100.71.200.103:8086 (IP Tailscale personal)
# El binding se hace en docker-compose.yml: "100.71.200.103:8086:80"
# NO expone el panel a Internet público.
